name: Nächtliche Feeds & Kurse
on:
  schedule:
    - cron: "15 4 * * *"   # 04:15 UTC, täglich
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Feeds einsammeln (Vorschläge nach data/eingang)
        run: node scripts/feeds.mjs
      - name: Tagesschlusskurse holen (data/kurse)
        run: node scripts/kurse.mjs
      - name: Änderungen committen
        run: |
          git config user.name "cyber-x-hub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/eingang data/kurse
          git diff --cached --quiet || git commit -m "Nächtlich: Feed-Vorschläge und Kurse $(date -u +%F)"
          git push
